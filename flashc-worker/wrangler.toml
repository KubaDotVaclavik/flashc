name = "flashc-worker"
main = "src/index.ts"
compatibility_date = "2024-09-19"

[[kv_namespaces]]
binding = "SESSIONS"
id = "eb4f761a3500433e86645c4f93cc08ca"

# UTC, so these are 08:00/13:00/19:00 local in summer, one hour earlier in winter.
[triggers]
crons = ["0 6,11,17 * * *"]

# Level steps, penalties and band boundaries are constants in the code — they
# depend on each other and are not meant to be tuned independently.
[vars]
# Chats allowed to use the bot; each gets its own data/chat_<id>.csv.
# Not a secret — knowing a chat id grants nothing without the account itself.
TELEGRAM_CHAT_IDS = "8605045164,8828858270"
# Asking and grading are mechanical and run several times a day, so they go to
# the cheap model. Looking a word up is the one call whose output is stored and
# read for years, so it gets the better one. Per-workspace rate limits in the
# Anthropic Console must allow both models named here.
CLAUDE_MODEL = "claude-sonnet-5"            # writes meaning and example
CLAUDE_MODEL_FAST = "claude-haiku-4-5-20251001"  # asks and grades

# Topics offered when adding a word. The key lands in the CSV's tags column,
# the label is the button, and the instruction steers Claude's meaning/example.
TOPICS = """
[
  { "key": "it", "label": "IT",
    "instruction": "The learner works in software development. Where the word has an IT sense, translate that sense, and set the example sentence in a developer's working life." },
  { "key": "general", "label": "General",
    "instruction": "Translate the everyday sense and set the example sentence in ordinary life." }
]
"""
# Logs each Telegram update verbatim to `wrangler tail`. Off by default: the
# updates carry the sender's name and the text of every message.
LOG_UPDATES = "false"
START_LEVEL = "2"        # level a new word starts at (0-2)
WORDS_PER_SESSION = "5"  # questions asked per session
LEARNING_POOL = "15"     # weakest learning candidates entering the draw
REVIEW_POOL = "5"        # due known/mastered candidates entering the draw
COOLDOWN_6 = "5"         # days a level 6 word rests
COOLDOWN_7 = "12"
COOLDOWN_8 = "25"
LEARNING_WARN = "40"     # warn above this many words in Learning
REVIEW_WARN = "60"       # warn above this many in Known+Mastered

# Secrets (set via `wrangler secret put`, not stored here):
#   TELEGRAM_BOT_TOKEN      - Telegram bot token, used to send messages
#   TELEGRAM_WEBHOOK_SECRET - random string, checked against Telegram's secret token header
#   ANTHROPIC_API_KEY       - asks questions, grades answers, looks up new words
#   GITHUB_TOKEN            - GitHub fine-grained PAT with Contents: Read/write on the flashc repo
#   GITHUB_REPO             - e.g. "KubaDotVaclavik/flashc"
