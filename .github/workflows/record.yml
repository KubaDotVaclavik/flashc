name: Record learning data

on:
  repository_dispatch:
    types: [flashc-answer, flashc-add]

concurrency: flashc-data

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - run: npx tsx src/reply.ts
        env:
          EVENT_TYPE: ${{ github.event.action }}
          WORD_ID: ${{ github.event.client_payload.word_id }}
          RESULT: ${{ github.event.client_payload.result }}
          SCORE: ${{ github.event.client_payload.score }}
          ANSWER: ${{ github.event.client_payload.answer }}
          WORD: ${{ github.event.client_payload.word }}
          MEANING: ${{ github.event.client_payload.meaning }}
          EXAMPLE: ${{ github.event.client_payload.example }}

      - name: Commit data changes
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "flashc-bot"
          git config user.email "noreply@github.com"
          git add data
          git commit -m "Record ${{ github.event.action }}"
          git pull --rebase
          git push
